name: Rename site file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "Alvarado509"
          git config user.email "alvaradoperilus9@gmail.com"
          git mv aa-roofing-demo-site.html index.html
          git commit -m "Rename aa-roofing-demo-site.html to index.html"
          git push
