name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          git config user.name "Alvarado509"
          git config user.email "alvaradoperilus9@gmail.com"
          git rm -q index.html
          mv aa-roofing-demo-site.html index.html
          git add -A
          git status --short
          git commit -m "Replace index.html with FINAL version"
          git push
